<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function () {
    try {
      var t = localStorage.getItem("archive:theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — The Hunter Files Project</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/search.css">
<link rel="stylesheet" href="css/document.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body data-page="search">
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<header class="site-header" id="site-header"></header>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Volumes and navigation"></aside>
  <div class="main-column">
    <main id="app-content">
      <h1>Search Hunter Files</h1>

      <div class="search-page-box">
        <label for="search-input" class="visually-hidden">Search query</label>
        <input type="search" id="search-input" placeholder='Try "Jane Doe #3" or Florida property' autofocus>
      </div>

      <fieldset class="search-filters" style="border:none; padding:0; margin:0;">
        <legend class="visually-hidden">Filters</legend>
        <label for="filter-volume">Volume
          <select id="filter-volume"></select>
        </label>
        <label for="filter-dataset">Dataset
          <select id="filter-dataset"></select>
        </label>
        <label for="filter-status">Status
          <select id="filter-status"></select>
        </label>
        <label for="filter-person">Person
          <select id="filter-person"></select>
        </label>
        <label for="filter-keyword">Keyword
          <select id="filter-keyword"></select>
        </label>
        <label for="filter-date">Date
          <select id="filter-date"></select>
        </label>
      </fieldset>

      <p id="search-meta-line" class="search-meta-line" role="status"></p>

      <p id="search-empty-state" class="search-empty" hidden>
        Enter a search term above, or choose a filter, to find documents.
      </p>

      <ul id="search-results" class="search-results"></ul>

      <noscript>
        <p style="padding:2rem 0;">This site requires JavaScript to search.</p>
      </noscript>
    </main>
    <footer class="site-footer">The Hunter Files Project — a contextual database for hunter files.</footer>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
