<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function () {
    try {
      var t = localStorage.getItem("archive:theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume — Document Archive</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/search.css">
<link rel="stylesheet" href="css/document.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body data-page="volume">
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<header class="site-header" id="site-header"></header>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Volumes and navigation"></aside>
  <div class="main-column">
    <main id="app-content" aria-live="polite">
      <noscript>
        <p style="padding:2rem;">This archive requires JavaScript to list volume contents.</p>
      </noscript>
    </main>
    <footer class="site-footer">Document Archive — a static, searchable record collection.</footer>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
